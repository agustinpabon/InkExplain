name: Archetype PR Review

on:
  pull_request:
    paths:
      - 'skills/inkexplain/references/archetypes/**'
      - 'skills/inkexplain/registry.json'
      - 'ATTRIBUTIONS.md'

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-archetype:
    name: Verify 5-file pack contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run repository validation
        run: node scripts/validate.mjs

      - name: Test prompt assembly for all archetypes
        run: node scripts/explain.mjs --list

      - name: Validate documentation build
        run: node scripts/build-docs.mjs --check
