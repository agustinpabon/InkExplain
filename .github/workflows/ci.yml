name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      # Pinned to the commits the v4 tags pointed at when this was written (v4.4.0 of each action),
      # so a moved tag cannot change what runs here. Bump them deliberately, in a reviewed change.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - name: Generated documents are current
        run: node scripts/build-docs.mjs --check
      - name: Validate repository
        run: node scripts/validate.mjs
      - name: Tests
        run: node --test "tests/**/*.test.mjs"
